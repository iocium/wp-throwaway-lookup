name: Package WordPress Plugin

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Package for WordPress
      run: |
        zip -r throwawaycloud-email-lookup.zip . \
          -x "tests/*" \
          -x "bin/*" \
          -x ".git/*" \
          -x ".gitignore" \
          -x ".github/*" \
          -x "./phpunit.xml.dist" \
          -x "*.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: wordpress-plugin-package
        path: throwawaycloud-email-lookup.zip